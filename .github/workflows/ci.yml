name: CI

on:
  push:
    branches: [main, meeting-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physicore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  cdr-compatibility:
    name: CDR compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install optional CDR decoder and independent cross-check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ros2,xcheck]"
          python -m pip check
      - name: Record decoder versions
        run: |
          python -c "from physicore_collector.investigator.cdr import decoder_info; print(decoder_info())"
          python -c "from importlib.metadata import version; print('rosbags', version('rosbags'))"
      - name: Run CDR and registry acceptance tests
        run: python -m pytest -q tests/test_cdr_m3a.py tests/test_signal_registry.py

  tests:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify installed CLI entry point
        run: |
          chmod go-w "$(command -v physicore-collector)"
          physicore-collector --help

      - name: Run test suite
        run: python -m pytest -q
